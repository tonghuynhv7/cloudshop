services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      PORT: 3000
      NODE_ENV: production

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - cloudshop-net


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "80:80"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - cloudshop-net


networks:
  cloudshop-net:
    driver: bridge