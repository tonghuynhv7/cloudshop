name: CloudShop CI   

# chạy pipeline khi push hoặc khi pull request vào main 
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

# kiểm tra sourcode + docker compose + health endpoint
  test:
  # jon test chỉ cần quyền đọc soucecode repository
    permissions:
      contents: read
   # github tao 1 ubuntu runner tam thoi de chay job
    runs-on: ubuntu-latest

    steps:

    # lay source code tu github repository
      - name: Checkout repository
        uses: actions/checkout@v4
# cai node-20 tren ubuntu runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
# cai dependencies dua chinh xac tren package-json 
      - name: Install dependencies
        run: npm ci
# kiem tra cu phap java script truoc khi build-container 
      - name: Verify application syntax
        run: node --check src/server.js
# build va chay dockercompose 
      - name: Build and start Docker Compose stack
        run: docker compose up -d --build
# kie mtra trang thai cua docker compose  
      - name: Show Docker Compose status
        run: docker compose ps
# thu goi /api/ready toi da 20 lan moi lan that bai thi cho 3s , tong thoi gian toi da la 60s 
      - name: Wait for CloudShop readiness
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost/api/ready; then
              echo "CloudShop is ready"
              exit 0
            fi

            echo "Waiting for CloudShop... attempt $i/20"
            sleep 3
          done

          echo "CloudShop failed to become ready"
          docker compose ps
          docker compose logs
          exit 1

      - name: Test health endpoint
        run: curl -fsS http://localhost/api/health

      - name: Test readiness endpoint
        run: curl -fsS http://localhost/api/ready

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v

# chi chay khi even la push va dong thoi la nhanh main va can jobs test da thanh cong 
  aws-auth:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: test

    permissions:
    # cho phep github action yeu cau OIDC ID TOken 
      id-token: write
    # cho phep doc repository
      contents: read

    runs-on: ubuntu-latest

    steps:

    # AWS OIDC Authentication 
    # khong luu aws_access_key_secret trong github-action 
    # github tao oidc token - AWS STS  xac minh 
    # cho runner assume iam role 
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
        # i am role mà github action được phép assume 
          role-to-assume: arn:aws:iam::610331149330:role/CloudShopGitHubActionsRole
          aws-region: ap-southeast-1
        # kiem tra runner hien tai dang su dung AWS identity nao
      - name: Verify AWS identity
        run: aws sts get-caller-identity