name: CloudShop CI

# Pipeline chạy khi:
# 1. Push code vào main
# 2. Pull Request vào main
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================================================
  # JOB 1: TEST APPLICATION
  # =========================================================
  test:

    # Job test chỉ cần quyền đọc source code
    permissions:
      contents: read

    # GitHub tạo Ubuntu Runner tạm thời
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # 1. Lấy source code từ GitHub Repository
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # 2. Cài Node.js 20 trên GitHub Runner
      # -----------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # -----------------------------------------------------
      # 3. Cài dependencies
      # npm ci sử dụng package-lock.json
      # -----------------------------------------------------
      - name: Install dependencies
        run: npm ci


      # -----------------------------------------------------
      # 4. Kiểm tra syntax JavaScript
      # -----------------------------------------------------
      - name: Verify application syntax
        run: node --check src/server.js


      # -----------------------------------------------------
      # 5. Build Docker images và chạy Docker Compose
      # -----------------------------------------------------
      - name: Build and start Docker Compose stack
        run: docker compose up -d --build


      # -----------------------------------------------------
      # 6. Kiểm tra trạng thái containers
      # -----------------------------------------------------
      - name: Show Docker Compose status
        run: docker compose ps


      # -----------------------------------------------------
      # 7. Chờ CloudShop sẵn sàng
      #
      # Thử tối đa 20 lần
      # Mỗi lần cách nhau 3 giây
      # Tổng thời gian tối đa khoảng 60 giây
      # -----------------------------------------------------
      - name: Wait for CloudShop readiness
        run: |
          for i in {1..20}; do

            if curl -fsS http://localhost/api/ready; then
              echo "CloudShop is ready"
              exit 0
            fi

            echo "Waiting for CloudShop... attempt $i/20"
            sleep 3

          done

          echo "CloudShop failed to become ready"

          docker compose ps
          docker compose logs

          exit 1


      # -----------------------------------------------------
      # 8. Test health endpoint
      # -----------------------------------------------------
      - name: Test health endpoint
        run: curl -fsS http://localhost/api/health


      # -----------------------------------------------------
      # 9. Test readiness endpoint
      # -----------------------------------------------------
      - name: Test readiness endpoint
        run: curl -fsS http://localhost/api/ready


      # -----------------------------------------------------
      # 10. Nếu job lỗi thì hiển thị logs
      # -----------------------------------------------------
      - name: Show logs on failure
        if: failure()
        run: docker compose logs


      # -----------------------------------------------------
      # 11. Cleanup
      #
      # always() = dù test pass hay fail vẫn cleanup
      # -----------------------------------------------------
      - name: Cleanup
        if: always()
        run: docker compose down -v



  # =========================================================
  # JOB 2: AWS OIDC AUTHENTICATION
  # =========================================================
  aws-auth:

    # Chỉ authenticate AWS khi:
    # - event là push
    # - branch là main
    #
    # Pull Request chỉ chạy job test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Job test phải thành công trước
    needs: test


    # -------------------------------------------------------
    # Quyền GitHub Actions
    # -------------------------------------------------------
    permissions:

      # Cho phép GitHub Actions xin OIDC ID Token
      id-token: write

      # Cho phép workflow đọc repository
      contents: read


    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # 1. Debug GitHub OIDC information
      #
      # Tạm thời dùng để lấy:
      # repository
      # repository_id
      # owner
      # owner_id
      # branch/ref
      #
      # Sau khi OIDC chạy ổn có thể xóa step này
      # -----------------------------------------------------
      - name: Show GitHub OIDC information
        run: |
          echo "repository=${{ github.repository }}"
          echo "repository_id=${{ github.repository_id }}"
          echo "repository_owner=${{ github.repository_owner }}"
          echo "repository_owner_id=${{ github.repository_owner_id }}"
          echo "ref=${{ github.ref }}"


      # -----------------------------------------------------
      # 2. AWS OIDC Authentication
      #
      # GitHub
      #   ↓
      # OIDC JWT
      #   ↓
      # AWS STS
      #   ↓
      # Assume CloudShopGitHubActionsRole
      #   ↓
      # Temporary AWS credentials
      #
      # Không sử dụng AWS Access Key trong GitHub Secrets
      # -----------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:

          # IAM Role mà GitHub Actions được phép assume
          role-to-assume: arn:aws:iam::610331149330:role/CloudShopGitHubActionsRole

          # Region CloudShop hiện tại
          aws-region: ap-southeast-1

          # Trong lúc debug chỉ thử 2 lần
          # để tránh "Assuming role with OIDC" quá lâu
          retry-max-attempts: 2


      # -----------------------------------------------------
      # 3. Kiểm tra AWS identity
      #
      # Nếu OIDC thành công sẽ thấy:
      #
      # arn:aws:sts::<ACCOUNT_ID>:
      # assumed-role/CloudShopGitHubActionsRole/...
      # -----------------------------------------------------
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: login to amazon ecr 
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build docker image
        env: 
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
          ECR_REPOSITORY: cloudshop-api
          IMAGE_TAG: ${{github.sha}}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .
      - name: push docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: cloudshop-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
