name: CloudShop CI

# CI chạy khi:
# 1. Push code vào main
# 2. Pull Request vào main
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================================================
  # TEST APPLICATION
  # =========================================================
  test:

    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # 1. Checkout source code
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # 2. Setup Node.js
      # -----------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # -----------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------
      - name: Install dependencies
        run: npm ci


      # -----------------------------------------------------
      # 4. Verify JavaScript syntax
      # -----------------------------------------------------
      - name: Verify application syntax
        run: node --check src/server.js


      # -----------------------------------------------------
      # 5. Build and start Docker Compose
      # -----------------------------------------------------
      - name: Build and start Docker Compose stack
        run: docker compose up -d --build


      # -----------------------------------------------------
      # 6. Show container status
      # -----------------------------------------------------
      - name: Show Docker Compose status
        run: docker compose ps


      # -----------------------------------------------------
      # 7. Wait for application readiness
      # -----------------------------------------------------
      - name: Wait for CloudShop readiness
        run: |
          for i in {1..20}; do

            if curl -fsS http://localhost/api/ready; then
              echo "CloudShop is ready"
              exit 0
            fi

            echo "Waiting for CloudShop... attempt $i/20"
            sleep 3

          done

          echo "CloudShop failed to become ready"

          docker compose ps
          docker compose logs

          exit 1


      # -----------------------------------------------------
      # 8. Test health endpoint
      # -----------------------------------------------------
      - name: Test health endpoint
        run: curl -fsS http://localhost/api/health


      # -----------------------------------------------------
      # 9. Test readiness endpoint
      # -----------------------------------------------------
      - name: Test readiness endpoint
        run: curl -fsS http://localhost/api/ready


      # -----------------------------------------------------
      # 10. Show logs if CI fails
      # -----------------------------------------------------
      - name: Show logs on failure
        if: failure()
        run: docker compose logs


      # -----------------------------------------------------
      # 11. Cleanup
      # -----------------------------------------------------
      - name: Cleanup
        if: always()
        run: docker compose down -v