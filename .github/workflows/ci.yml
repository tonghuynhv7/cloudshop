name: CloudShop CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================================================
  # TEST APPLICATION
  # =========================================================
  test:

    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # 1. Checkout source code
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # 2. Setup Node.js
      # -----------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json


      # -----------------------------------------------------
      # 3. Install backend dependencies
      # -----------------------------------------------------
      - name: Install backend dependencies
        run: npm ci


      # -----------------------------------------------------
      # 4. Verify backend JavaScript syntax
      # -----------------------------------------------------
      - name: Verify backend syntax
        run: node --check src/server.js


      # -----------------------------------------------------
      # 5. Install frontend dependencies
      # -----------------------------------------------------
      - name: Install frontend dependencies
        run: npm ci --prefix frontend


      # -----------------------------------------------------
      # 6. Build React frontend
      # -----------------------------------------------------
      - name: Build frontend
        run: npm run build --prefix frontend


      # -----------------------------------------------------
      # 7. Validate Docker Compose configuration
      # -----------------------------------------------------
      - name: Validate Docker Compose
        run: docker compose config


      # -----------------------------------------------------
      # 8. Build and start complete CloudShop stack
      # -----------------------------------------------------
      - name: Build and start Docker Compose stack
        run: docker compose up -d --build


      # -----------------------------------------------------
      # 9. Show container status
      # -----------------------------------------------------
      - name: Show Docker Compose status
        run: docker compose ps


      # -----------------------------------------------------
      # 10. Wait for CloudShop readiness
      # -----------------------------------------------------
      - name: Wait for CloudShop readiness
        run: |
          for i in {1..30}; do

            if curl -fsS http://localhost/api/ready; then
              echo "CloudShop is ready"
              exit 0
            fi

            echo "Waiting for CloudShop... attempt $i/30"
            sleep 3

          done

          echo "CloudShop failed to become ready"

          docker compose ps
          docker compose logs --no-color

          exit 1


      # -----------------------------------------------------
      # 11. Test frontend
      # -----------------------------------------------------
      - name: Test frontend
        run: |
          curl -fsS http://localhost > /dev/null
          echo "Frontend is reachable"


      # -----------------------------------------------------
      # 12. Test backend health endpoint
      # -----------------------------------------------------
      - name: Test health endpoint
        run: curl -fsS http://localhost/api/health


      # -----------------------------------------------------
      # 13. Test backend readiness endpoint
      # -----------------------------------------------------
      - name: Test readiness endpoint
        run: curl -fsS http://localhost/api/ready


      # -----------------------------------------------------
      # 14. Test products API
      # -----------------------------------------------------
      - name: Test products endpoint
        run: curl -fsS http://localhost/api/products


      # -----------------------------------------------------
      # 15. Show logs if CI fails
      # -----------------------------------------------------
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color


      # -----------------------------------------------------
      # 16. Cleanup
      # -----------------------------------------------------
      - name: Cleanup
        if: always()
        run: docker compose down -v